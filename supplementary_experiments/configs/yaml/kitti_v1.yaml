# A4 SemanticKITTI executable contract. Runtime training/model values come from
# configs/A4_*.json; this file defines dataset, preprocessing and method semantics.
version: a4-kitti-v3
experiment: A4_SemanticKITTI

dataset:
  name: SemanticKITTI
  root: ../kitti_experiment/data
  sequence: "00"
  task: ground_nonground_binary
  split:
    mode: chronological_sequence00
    train: [0, 3200]
    val: [3200, 3800]
    test: [3800, 4541]
  num_points: 4096
  features: [x, y, z]
  label_mapping:
    version: semantickitti-raw-ground-v1
    source: SemanticKITTI official raw semantic IDs (.label low 16 bits)
    output_values: [0, 1, 255]
  ground_semantic_ids: [40, 44, 48, 49, 60, 72]
  ignore_semantic_ids: [0, 1]
  valid_raw_semantic_ids: [0, 1, 10, 11, 13, 15, 16, 18, 20, 30, 31, 32, 40, 44, 48, 49, 50, 51, 52, 60, 70, 71, 72, 80, 81, 99, 252, 253, 254, 255, 256, 257, 258, 259]
  non_ground_rule: all_other_valid_raw_semantic_ids

preprocessing:
  reject_zero_xyz: true
  ignore_label_value: 255
  exclude_ignore_before_sampling: true
  training_label_values: [0, 1]
  min_valid_points: 100
  sampling: stratified_without_replacement_when_possible
  min_ground_ratio: 0.10
  center_xyz: true
  # Fixed and method/seed-independent: all runs see identical raw val/test blocks.
  eval_sampling_seed: 20260900

methods:
  BASELINE:
    train_transform: none
    applies_to: train_only
    online_augmentation: false
  TRADITIONAL:
    train_transform: traditional
    applies_to: train_only
    online_augmentation: false
    scale_range: [0.85, 1.15]
    rotate_z_degrees: [-180.0, 180.0]
    jitter_sigma: 0.02
    jitter_clip: 0.05
    flip_x_probability: 0.50
  LOADSIM:
    train_transform: loadsim
    applies_to: train_only
    online_augmentation: false
    class_mask:
      source: binary_ground_label
      value: 1
      strict: true
    n_ops: [2, 4]
    front_alpha: [0.15, 0.25]
    bucket_width_m: [0.8, 1.5]
    collapse_dz_m: [0.03, 0.10]
    collapse_dx_m: [0.02, 0.06]
    surface_noise:
      enabled: true
      axis: z
      sigma_m: 0.02
      clip_m: 0.05
    # Smoothing is disabled in the formal adapter; no unmasked global operation
    # is allowed after the ground-only physical transform.
    smoothing:
      enabled: false

training_runtime:
  source: run_json
  loss: weighted_cross_entropy
  class_weights: [0.25, 0.75]
  amp: false
  num_workers: 0
  checkpoint_every_updates: 100
  deterministic_algorithms: true
  baseline_online_augmentation: false

evaluation:
  validation_source: raw_frames
  test_source: raw_frames
  augmentation: none
  selection_metric: mIoU
  per_frame_block_metrics: true
  points_per_block: 4096
  blocks_per_frame: 1

debug:
  real_frames_only: true
  train_frames: 2
  val_frames: 1
  test_frames: 1
  epochs: 1
  batch_size: 2
  max_updates: 1
  checkpoint_every_updates: 1
